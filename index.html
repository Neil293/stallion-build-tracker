<style>
  :root {
    --bg: #eef1ef;
    --surface: #ffffff;
    --surface-2: #e4e9e6;
    --border: #c9d2cd;
    --text: #16211d;
    --text-muted: #56655e;
    --navy: #1f3a5f;
    --navy-strong: #142a45;
    --orange: #d9611f;
    --orange-strong: #b84f16;
    --green: #2f7d4f;
    --green-bg: #e1f0e6;
    --amber: #93650f;
    --amber-bg: #faedd2;
    --chip-asa-bg: #dfe9f3;
    --chip-asa-text: #1f3a5f;
    --chip-petg-bg: #f5e6da;
    --chip-petg-text: #8a4a1c;
    --focus: #2f6fb8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12181a;
      --surface: #1b2325;
      --surface-2: #222c2e;
      --border: #333f41;
      --text: #e9efe9;
      --text-muted: #a1aead;
      --navy: #7fa8d9;
      --navy-strong: #a8c6e8;
      --orange: #ff8a44;
      --orange-strong: #ffa26a;
      --green: #6fce93;
      --green-bg: #163524;
      --amber: #e4b559;
      --amber-bg: #3a2d10;
      --chip-asa-bg: #223449;
      --chip-asa-text: #a9c7e8;
      --chip-petg-bg: #3d2c1c;
      --chip-petg-text: #eab27f;
      --focus: #7fa8d9;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12181a;
    --surface: #1b2325;
    --surface-2: #222c2e;
    --border: #333f41;
    --text: #e9efe9;
    --text-muted: #a1aead;
    --navy: #7fa8d9;
    --navy-strong: #a8c6e8;
    --orange: #ff8a44;
    --orange-strong: #ffa26a;
    --green: #6fce93;
    --green-bg: #163524;
    --amber: #e4b559;
    --amber-bg: #3a2d10;
    --chip-asa-bg: #223449;
    --chip-asa-text: #a9c7e8;
    --chip-petg-bg: #3d2c1c;
    --chip-petg-text: #eab27f;
    --focus: #7fa8d9;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    padding-inline: 16px;
  }
  * { box-sizing: border-box; }
  h1, h2, h3 { font-family: "Barlow Condensed", system-ui, sans-serif; margin: 0; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  button { font: inherit; }
  ::selection { background: var(--orange); color: #fff; }

  #app { max-width: 760px; margin: 0 auto; padding-block: 14px 48px; }

  header.top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--bg);
    padding-block: 6px 10px;
    margin-inline: -16px;
    padding-inline: 16px;
  }
  .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .brand h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--navy-strong);
    text-transform: uppercase;
  }
  .brand .subtitle {
    font-size: 12px;
    color: var(--text-muted);
    font-family: "IBM Plex Mono", monospace;
    margin-top: -2px;
  }
  .sync-pill {
    font-size: 10.5px;
    font-family: "IBM Plex Mono", monospace;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-muted);
    white-space: nowrap;
  }
  .sync-pill.on { color: var(--green); border-color: var(--green); }

  .tabs {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    appearance: none;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 8px 4px 9px;
    font-family: "Barlow Condensed", sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-muted);
    cursor: pointer;
    margin-right: 14px;
  }
  .tab-btn.active { color: var(--orange-strong); border-bottom-color: var(--orange); }
  .tab-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .progress-wrap { margin-top: 12px; }
  .progress-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 5px; }
  .progress-row .count { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .progress-row .count b { color: var(--navy-strong); font-size: 15px; }
  .progress-bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .progress-bar > div { height: 100%; background: linear-gradient(90deg, var(--navy), var(--orange)); border-radius: 999px; transition: width .25s ease; }
  .optional-note { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; font-family: "IBM Plex Mono", monospace; }

  .callout {
    background: var(--amber-bg);
    border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent);
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 14px;
  }
  .callout h2 { font-size: 15px; color: var(--amber); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; }
  .callout ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
  .callout li { font-size: 13.5px; line-height: 1.4; }
  .callout .go { color: var(--navy-strong); font-weight: 600; cursor: pointer; text-decoration: underline; background: none; border: none; padding: 0; font-size: inherit; font-family: inherit; }

  .filters {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .filters select {
    font: inherit;
    font-size: 13px;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    flex: 1 1 140px;
    min-width: 0;
  }

  .section-card { margin-top: 20px; }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .section-head h2 {
    font-size: 19px;
    color: var(--navy-strong);
    text-transform: uppercase;
    letter-spacing: .02em;
  }
  .section-head .sub-count { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .part-row {
    display: flex;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    align-items: flex-start;
  }
  .part-row:last-child { border-bottom: none; }
  .part-row input[type=checkbox] {
    width: 20px; height: 20px;
    flex: none;
    margin-top: 2px;
    accent-color: var(--green);
    cursor: pointer;
  }
  .part-main { flex: 1; min-width: 0; }
  .part-name-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .part-name { font-weight: 600; font-size: 14.5px; }
  .part-row.checked .part-name { color: var(--text-muted); text-decoration: line-through; text-decoration-color: var(--green); text-decoration-thickness: 1.5px; }
  .chip { font-size: 10.5px; font-family: "IBM Plex Mono", monospace; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .chip.qty { background: var(--surface-2); color: var(--text-muted); }
  .chip.asa { background: var(--chip-asa-bg); color: var(--chip-asa-text); }
  .chip.petg { background: var(--chip-petg-bg); color: var(--chip-petg-text); }
  .chip.optional { background: var(--amber-bg); color: var(--amber); }
  .chip.source { border: 1px solid var(--border); color: var(--text-muted); background: none; }

  .photo-btn {
    flex: none;
    width: 26px; height: 26px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .photo-btn:hover, .photo-btn:focus-visible { color: var(--orange-strong); border-color: var(--orange); }
  .photo-btn svg { width: 15px; height: 15px; }
  .photo-btn.has-photo { color: var(--navy-strong); border-color: var(--navy); }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(10, 14, 12, 0.6);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-box {
    background: var(--surface);
    border-radius: 14px;
    max-width: 480px;
    width: 100%;
    max-height: 88vh;
    overflow: auto;
    padding: 16px;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 10px; right: 10px;
    width: 30px; height: 30px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }
  .modal-caption { font-weight: 600; font-size: 15px; margin-bottom: 10px; padding-right: 30px; }
  .modal-img-wrap { display: flex; align-items: center; justify-content: center; min-height: 160px; }
  .modal-img-wrap img { max-width: 100%; max-height: 60vh; border-radius: 8px; background: #fff; }
  .modal-missing { color: var(--text-muted); font-size: 13px; line-height: 1.5; text-align: center; padding: 20px 6px; }
  .modal-missing code { font-family: "IBM Plex Mono", monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
  .modal-loading { color: var(--text-muted); font-size: 13px; text-align: center; padding: 30px 6px; }

  .part-settings { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }
  .part-notes { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.4; }
  .part-path { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--text-muted); opacity: .75; margin-top: 4px; word-break: break-word; }

  .empty-state { text-align: center; color: var(--text-muted); padding: 30px 10px; font-size: 13.5px; }

  /* Settings tab */
  .config-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 14px;
  }
  .config-card h3 { font-size: 17px; color: var(--navy-strong); text-transform: uppercase; letter-spacing: .02em; }
  .config-card .config-note { font-size: 12.5px; color: var(--amber); margin-top: 5px; line-height: 1.4; }
  .config-card .config-note.plain { color: var(--text-muted); }
  .config-card .config-disabled-note { font-size: 12.5px; color: var(--text-muted); margin-top: 8px; font-style: italic; }
  .options-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .option-pill {
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 13px;
    background: var(--surface);
    color: var(--text);
    text-align: left;
    flex: 1 1 150px;
  }
  .option-pill.selected { border-color: var(--orange); background: color-mix(in srgb, var(--orange) 12%, var(--surface)); }
  .option-pill.selected .opt-label { color: var(--orange-strong); font-weight: 600; }
  .option-pill:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .opt-label { display: block; font-weight: 500; }
  .opt-radio-row { display: flex; align-items: center; gap: 7px; }
  .opt-radio-row input { accent-color: var(--orange); width: 15px; height: 15px; }

  footer.credits {
    margin-top: 30px;
    font-size: 11px;
    color: var(--text-muted);
    font-family: "IBM Plex Mono", monospace;
    text-align: center;
    line-height: 1.6;
  }

  @media (max-width: 420px) {
    .brand h1 { font-size: 21px; }
    .filters select { flex-basis: 100%; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>

(function () {
  "use strict";

  var LWASA = {
    label: "LW-ASA",
    chipClass: "asa",
    settingsLine: "263°C nozzle · 90°C bed (High-Temp plate + glue stick) · 0.56 flow · 10–50% fan (ramped)"
  };
  var PETG = {
    label: "Bambu PETG",
    chipClass: "petg",
    settingsLine: "~250°C nozzle (Bambu PETG Basic default) · 70–80°C bed (textured PEI) · ~1.0 flow · ~30–70% fan (Bambu default)"
  };
  var FILAMENTS = { LWASA: LWASA, PETG: PETG };

  var BASE_ZIP = "STALLION-FILES-zospag.zip → STALLION FILES/";
  var VTOL_ZIP = "STALLION-VTOL-FILES-atx12o.zip → STALLION VTOL FILES/";

  var PARTS = [
    // Fuselage
    { id: "fus-1", section: "Fuselage", part: "FUS 1L / FUS 1R", qty: "1 each", source: "V2", path: BASE_ZIP + "V2/FUSELAGE/FUS 1L.STL / FUS 1R.STL", filament: "LWASA", infill: "3% gyroid infill (per V1 manual guidance)" },
    { id: "fus-2", section: "Fuselage", part: "FUS 2L / FUS 2R", qty: "1 each", source: "V2", path: BASE_ZIP + "V2/FUSELAGE/FUS 2L.STL / FUS 2R.STL", filament: "LWASA", infill: "3% gyroid infill" },
    { id: "fus-3", section: "Fuselage", part: "FUS 3L / FUS 3R", qty: "1 each", source: "V2", path: BASE_ZIP + "V2/FUSELAGE/FUS 3L.STL / FUS 3R.STL", filament: "LWASA", infill: "3% gyroid infill" },
    { id: "fus-4", section: "Fuselage", part: "FUS 4L / FUS 4R", qty: "1 each", source: "V2", path: BASE_ZIP + "V2/FUSELAGE/FUS 4L.STL / FUS 4R.STL", filament: "LWASA", infill: "3% gyroid infill" },
    { id: "fus-5", section: "Fuselage", part: "FUS 5L / FUS 5R", qty: "1 each", source: "V2", path: BASE_ZIP + "V2/FUSELAGE/FUS 5L.STL / FUS 5R.STL", filament: "LWASA", infill: "3% gyroid infill" },
    { id: "fus-root", section: "Fuselage", part: "FUS ROOT L / FUS ROOT R", qty: "1 each", source: "V2", path: BASE_ZIP + "V2/FUSELAGE/FUS ROOT L.STL / FUS ROOT R.STL", filament: "PETG", infill: "New in V2 (no V1 equivalent) — DRAFT 20% grid infill" },
    { id: "hatch-front", section: "Fuselage", part: "HATCH FRONT 1 / 2", qty: "1 each", source: "V2", path: BASE_ZIP + "V2/FUSELAGE/HATCH FRONT 1.STL / HATCH FRONT 2.STL", filament: "LWASA", infill: "3% gyroid infill" },
    { id: "hatch-rear", section: "Fuselage", part: "HATCH REAR 1 / 2", qty: "1 each", source: "V2", path: BASE_ZIP + "V2/FUSELAGE/HATCH REAR 1.STL / HATCH REAR 2.STL", filament: "LWASA", infill: "3% gyroid infill" },
    { id: "front-reinforcement", section: "Fuselage", part: "FRONT REINFORCEMENT", qty: 1, source: "V2", path: BASE_ZIP + "V2/FUSELAGE/FRONT REINFORCEMENT.STL", filament: "PETG", infill: "DRAFT 20% grid infill" },
    { id: "battery-pad", section: "Fuselage", part: "BATTERY PAD", qty: 1, source: "V2", path: BASE_ZIP + "V2/FUSELAGE/BATTERY PAD.STL", filament: "PETG", infill: "DRAFT 20% grid infill" },
    { id: "boom-fus-mount", section: "Fuselage", part: "BOOM FUS MOUNT", qty: 1, source: "V2", path: BASE_ZIP + "V2/FUSELAGE/BOOM FUS MOUNT.STL", filament: "PETG", infill: "20% grid infill" },
    { id: "lock-1-2", section: "Fuselage", part: "LOCK 1 / LOCK 2", qty: "1 each", source: "V2", path: BASE_ZIP + "V2/FUSELAGE/LOCK 1.STL / LOCK 2.STL", filament: "PETG", infill: "20% grid infill" },
    { id: "lock-spring", section: "Fuselage", part: "LOCK SPRING", qty: 1, source: "V2", path: BASE_ZIP + "V2/FUSELAGE/LOCK SPRING.STL", filament: "PETG", infill: "New in V2 — flex part, print in PETG or TPU; 20% infill" },

    // Fuselage - Nose (config group: nose_variant)
    { id: "nose-clean", section: "Fuselage", sub: "Nose", part: "NOSE CLEAN", qty: 1, source: "V2", path: BASE_ZIP + "V2/FUSELAGE/NOSE CLEAN.STL", filament: "LWASA", infill: "3% gyroid + 2 walls", group: { id: "nose_variant", option: "clean" } },
    { id: "nose-vtx", section: "Fuselage", sub: "Nose", part: "NOSE + NOSE TOP", qty: "1 each", source: "V2", path: BASE_ZIP + "V2/FUSELAGE/NOSE.STL / NOSE TOP.STL", filament: "LWASA", infill: "3% gyroid + 2 walls", group: { id: "nose_variant", option: "vtx" } },
    { id: "nose-gimbal", section: "Fuselage", sub: "Nose", part: "NOSE GIMBAL + NOSE TOP GIMBAL", qty: "1 each", source: "V2", path: BASE_ZIP + "V2/FUSELAGE/NOSE GIMBAL .STL / NOSE TOP GIMBAL.STL", filament: "LWASA", infill: "3% gyroid + 2 walls — gimbal-camera mount nose", group: { id: "nose_variant", option: "gimbal" } },

  function isPartActive(part, settings) {
    if (!part.group) return true;
    if (part.group.id === "vtail_servo_orientation" && settings.tail_config !== "v_tail") return false;
    if (part.group.id === "motor_mount_size") {
      if (settings.motor_mount_size === "both") return true;
      return settings.motor_mount_size === part.group.option;
    }
    return settings[part.group.id] === part.group.option;

    tab: "checklist",
    filterSection: "all",
    filterFilament: "all",
    dbReady: false,
    db: null
  };

  function loadLocal() {
    try {
      var c = localStorage.getItem(LS_CHECKED);
      if (c) state.checked = JSON.parse(c);
    } catch (e) {}
    try {
      var s = localStorage.getItem(LS_SETTINGS);
      if (s) state.settings = Object.assign({}, DEFAULT_SETTINGS, JSON.parse(s));
    } catch (e) {}
  }
  function saveLocalChecked() {
    try { localStorage.setItem(LS_CHECKED, JSON.stringify(state.checked)); } catch (e) {}
  }
  function saveLocalSettings() {
    try { localStorage.setItem(LS_SETTINGS, JSON.stringify(state.settings)); } catch (e) {}
  }

  function setChecked(id, val) {
    state.checked[id] = val;
    render();
    if (state.db) {
      state.db.collection("checklist").doc(id).set({ checked: val, updatedAt: new Date().toISOString() }).catch(function () {});
    } else {
      saveLocalChecked();
    }
  }

  function setSetting(groupId, optionId) {
    state.settings[groupId] = optionId;
    render();
    if (state.db) {
      state.db.doc("settings/config").set(state.settings).catch(function () {});
    } else {
      saveLocalSettings();
    }
  }

  loadLocal();

  // ---- rendering ----
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      if (k === "class") node.className = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined) node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }
  function text(s) { return document.createTextNode(s); }

  function activeParts() {
    return PARTS.filter(function (p) { return isPartActive(p, state.settings); });
  }

  function renderProgress(container) {
    var active = activeParts();
    var required = active.filter(function (p) { return !p.optional; });
    var optional = active.filter(function (p) { return p.optional; });
    var doneRequired = required.filter(function (p) { return state.checked[p.id]; }).length;
    var doneOptional = optional.filter(function (p) { return state.checked[p.id]; }).length;
    var pct = required.length ? Math.round((doneRequired / required.length) * 100) : 0;

    var wrap = el("div", { class: "progress-wrap" });
    var row = el("div", { class: "progress-row" });
    row.appendChild(el("span", { class: "count" }, [
      el("b", { text: doneRequired + "/" + required.length }),
      text(" printed")
    ]));
    row.appendChild(el("span", { class: "count", text: pct + "%" }));
    wrap.appendChild(row);
    var bar = el("div", { class: "progress-bar" }, [el("div", { style: "width:" + pct + "%" })]);
    wrap.appendChild(bar);
    if (optional.length) {
      wrap.appendChild(el("div", { class: "optional-note", text: "+ " + doneOptional + "/" + optional.length + " optional jig(s) (skip by default)" }));
    }
    container.appendChild(wrap);
  }

  function renderCallout(container) {

    callout.appendChild(ul);

  function labelFor(groupId, optionId) {
    var group = CONFIG_GROUPS.filter(function (g) { return g.id === groupId; })[0];

    var opt = group.options.filter(function (o) { return o.id === optionId; })[0];

  function renderFilters(container) {

    filSel.addEventListener("change", function (e) { state.filterFilament = e.target.value; render(); });
    wrap.appendChild(filSel);

  var CAMERA_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.2"/></svg>';

  function renderPartRow(part) {
    var checked = !!state.checked[part.id];
    var f = FILAMENTS[part.filament];
    var row = el("div", { class: "part-row" + (checked ? " checked" : "") });
    var cb = el("input", { type: "checkbox" });

    cb.addEventListener("change", function () { setChecked(part.id, cb.checked); });
    row.appendChild(cb);

    var main = el("div", { class: "part-main" });

    if (part.source) nameLine.appendChild(el("span", { class: "chip source", text: part.source }));
    if (part.optional) nameLine.appendChild(el("span", { class: "chip optional", text: "optional" }));
    main.appendChild(nameLine);

    main.appendChild(el("div", { class: "part-settings", text: f.settingsLine }));

    if (part.optionalNote) main.appendChild(el("div", { class: "part-notes", text: part.optionalNote }));
    main.appendChild(el("div", { class: "part-path", text: part.path }));

    row.appendChild(main);
    return row;
  }

  function renderChecklist(container) {
    renderCallout(container);
    renderFilters(container);

    var active = activeParts();
    if (state.filterFilament !== "all") active = active.filter(function (p) { return p.filament === state.filterFilament; });

    var sectionsToShow = state.filterSection === "all" ? SECTION_ORDER : [state.filterSection];
    var anyRendered = false;

    sectionsToShow.forEach(function (sectionName) {
      var parts = active.filter(function (p) { return p.section === sectionName; });
      if (!parts.length) return;
      anyRendered = true;
      var done = parts.filter(function (p) { return state.checked[p.id]; }).length;
      var card = el("div", { class: "section-card", id: "section-" + sectionName.replace(/[^a-zA-Z]/g, "") });
      var head = el("div", { class: "section-head" }, [
        el("h2", { text: sectionName }),
        el("span", { class: "sub-count", text: done + "/" + parts.length })

      card.appendChild(head);

      var lastSub = null;
      parts.forEach(function (p) {
        if (p.sub && p.sub !== lastSub) {
          card.appendChild(el("div", { class: "part-notes", style: "margin-top:6px;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.04em;", text: p.sub }));
          lastSub = p.sub;

        card.appendChild(renderPartRow(p));
      });
      container.appendChild(card);

      container.appendChild(el("div", { class: "empty-state", text: "No parts match the current filters." }));

      if (group.note) card.appendChild(el("div", { class: "config-note" + (group.noteClass ? " " + group.noteClass : ""), text: group.note }));
      if (disabled) {
        card.appendChild(el("div", { class: "config-disabled-note", text: "Only applies when Tail configuration is set to V-Tail." }));
      } else {
        var row = el("div", { class: "options-row" });
        group.options.forEach(function (opt) {
          var selected = state.settings[group.id] === opt.id;
          var pill = el("button", { class: "option-pill" + (selected ? " selected" : ""), type: "button", onclick: function () { setSetting(group.id, opt.id); } });
          pill.appendChild(el("span", { class: "opt-label", text: opt.label }));
          if (opt.desc) pill.appendChild(el("span", { style: "font-size:11.5px;color:var(--text-muted);", text: opt.desc }));
          row.appendChild(pill);
        });
        card.appendChild(row);
      }
      container.appendChild(card);
    });
  }

  // ---- photo preview modal ----
  var previewOverlay = null;

  function ensurePreviewModal() {
    if (previewOverlay) return previewOverlay;
    previewOverlay = el("div", { class: "modal-overlay", hidden: "hidden" });
    previewOverlay.addEventListener("click", function (e) {
      if (e.target === previewOverlay) closePreview();
    });
    document.body.appendChild(previewOverlay);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closePreview();
    });
    return previewOverlay;
  }

  function closePreview() {
    if (previewOverlay) previewOverlay.hidden = true;
  }

  function tryLoadImage(id, extIndex, onSuccess, onFail) {
    if (extIndex >= IMAGE_EXTENSIONS.length) { onFail(); return; }
    var src = "images/" + id + "." + IMAGE_EXTENSIONS[extIndex];
    var probe = new Image();
    probe.onload = function () { onSuccess(src); };
    probe.onerror = function () { tryLoadImage(id, extIndex + 1, onSuccess, onFail); };
    probe.src = src;
  }

  function openPreview(part) {
    var overlay = ensurePreviewModal();
    overlay.innerHTML = "";
    var box = el("div", { class: "modal-box" });
    box.appendChild(el("button", { class: "modal-close", type: "button", "aria-label": "Close", onclick: closePreview, text: "×" }));
    box.appendChild(el("div", { class: "modal-caption", text: part.part }));
    var body = el("div", { class: "modal-loading", text: "Loading…" });
    box.appendChild(body);
    overlay.appendChild(box);
    overlay.hidden = false;

    tryLoadImage(part.id, 0, function (src) {
      body.replaceWith(el("div", { class: "modal-img-wrap" }, [el("img", { src: src, alt: part.part })]));
    }, function () {
      body.replaceWith(el("div", { class: "modal-missing" }, [
        text("No photo yet for this part."),
        document.createElement("br"),
        document.createElement("br"),
        text("Drop a photo in the repo at "),
        el("code", { text: "images/" + part.id + ".jpg" }),
        text(" (or .png) and it'll show up here automatically.")
      ]));
    });
  }

  function render() {
    var app = document.getElementById("app");
    app.innerHTML = "";

    var header = el("header", { class: "top" });
    var brand = el("div", { class: "brand" }, [
      el("div", null, [
        el("h1", { text: "Stallion Build Tracker" }),
        el("div", { class: "subtitle", text: "V2 airframe · VTOL conversion" })
      ]),
      el("span", { class: "sync-pill" + (state.dbReady ? " on" : ""), text: state.dbReady ? "synced" : "saved on this device" })
    ]);
    header.appendChild(brand);

    var tabs = el("div", { class: "tabs" }, [
      el("button", { class: "tab-btn" + (state.tab === "checklist" ? " active" : ""), type: "button", onclick: function () { state.tab = "checklist"; render(); }, text: "Checklist" }),
      el("button", { class: "tab-btn" + (state.tab === "settings" ? " active" : ""), type: "button", onclick: function () { state.tab = "settings"; render(); }, text: "Settings" })
    ]);
    header.appendChild(tabs);

    if (state.tab === "checklist") renderProgress(header);
    app.appendChild(header);

    if (state.tab === "checklist") renderChecklist(app);
    else renderSettings(app);

    app.appendChild(el("footer", { class: "credits", text: "Flightory Stallion V2 + VTOL · print settings source: flightory.com/printsettings (fetched 2026-09-20)" }));
  }

  render();
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
